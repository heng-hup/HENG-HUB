name: HENG-HUB Auto Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"  # รันอัตโนมัติทุก 6 ชั่วโมง

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: heng-frontend

      - name: Build project
        run: npm run build
        working-directory: heng-frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: heng-hub
          directory: heng-frontend/dist