<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>⚡ HENG Super App</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#020c44,#010a2e);
color:white;
text-align:center;
}

/* TOP BAR */

.topbar{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
box-sizing:border-box;
z-index:100;
}

.install{
background:#ffd700;
color:black;
padding:8px 16px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}

.auth a{
color:white;
margin-left:15px;
text-decoration:none;
font-weight:bold;
}

/* LOGO */

.logo{
font-size:40px;
color:#ffd700;
margin-top:110px;
font-weight:bold;
}

/* SEARCH */

.search{
margin-top:20px;
}

.search input{
width:70%;
padding:14px;
border-radius:30px;
border:none;
font-size:16px;
}

/* GRID SERVICES */

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
max-width:900px;
margin:auto;
padding:40px 20px 120px 20px;
}

.card{
background:linear-gradient(180deg,#0a2cff,#001a8f);
padding:20px;
border-radius:14px;
cursor:pointer;
transition:0.2s;
font-size:14px;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

/* BOTTOM MENU */

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#000;
display:flex;
justify-content:space-around;
padding:12px 0;
border-top:1px solid rgba(255,255,255,0.1);
}

.bottom div{
color:white;
font-size:14px;
cursor:pointer;
}

.bottom div:hover{
color:#ffd700;
}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

<div id="installBtn" class="install">
📲 ติดตั้งแอพ
</div>

<div class="auth">
<a href="/login.html">ล็อกอิน</a>
<a href="/login.html">สมัคร</a>
</div>

</div>

<!-- LOGO -->

<div class="logo">⚡ HENG</div>

<!-- SEARCH -->

<div class="search">
<input id="searchBox" placeholder="ค้นหาบริการ เช่น โรงแรม ร้านอาหาร รถเช่า">
</div>

<!-- SERVICES -->

<div class="grid">

<div class="card">🏨 โรงแรม</div>
<div class="card">✈️ เที่ยวบิน</div>
<div class="card">🎟️ กิจกรรม</div>
<div class="card">🚗 รถเช่า</div>

<div class="card">🚕 แท็กซี่</div>
<div class="card">🍔 อาหาร</div>
<div class="card">🛍️ ช้อปปิ้ง</div>
<div class="card">🏥 สุขภาพ</div>

<div class="card">🛡️ ประกัน</div>
<div class="card">🏫 คอร์สเรียน</div>
<div class="card">🎮 เกม</div>
<div class="card">📱 แอป</div>

</div>

<!-- BOTTOM MENU -->

<div class="bottom">

<div onclick="goHome()">🏠 หน้าแรก</div>
<div onclick="openMarket()">🛍 ร้านค้า</div>
<div onclick="openVideo()">🎬 วิดีโอ</div>
<div onclick="openChat()">💬 แชท</div>
<div onclick="openProfile()">👤 โปรไฟล์</div>

</div>

<script>

/* SERVICE CLICK */

document.querySelectorAll(".card").forEach(btn=>{

btn.onclick=()=>{

let text=btn.innerText

window.open(
"https://www.google.com/search?q="+encodeURIComponent(text),
"_blank"
)

}

})

/* SEARCH */

document.getElementById("searchBox").addEventListener("keypress",function(e){

if(e.key==="Enter"){

let q=this.value

window.open(
"https://www.google.com/search?q="+encodeURIComponent(q),
"_blank"
)

}

})

/* BOTTOM MENU */

function goHome(){
location.href="/"
}

function openMarket(){
alert("กำลังเปิด HENG Market")
}

function openVideo(){
alert("กำลังเปิด HENG Video")
}

function openChat(){
alert("กำลังเปิด HENG Chat")
}

function openProfile(){
location.href="/login.html"
}

/* PWA INSTALL */

let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{

e.preventDefault();

deferredPrompt=e;

document.getElementById("installBtn").onclick=()=>{

deferredPrompt.prompt();

}

})

</script>

</body>
</html>
