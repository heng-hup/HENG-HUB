<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HENG GLOBAL CONTROL PANEL</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col items-center justify-center font-sans">
  <div class="w-full max-w-3xl p-6">
    <!-- โลโก้และหัวข้อ -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-2">
        <div class="w-16 h-16 bg-gradient-to-br from-yellow-400 to-blue-600 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-lg">
          ⚡
        </div>
      </div>
      <h1 class="text-3xl font-extrabold text-yellow-400">HENG HENG GLOBAL CO., LTD.</h1>
      <p class="text-blue-400 text-sm mt-1">ระบบควบคุมกลาง | HENG GLOBAL CONTROL PANEL</p>
    </div>

    <!-- สถานะระบบ -->
    <div id="status-card" class="bg-gray-800 rounded-lg p-4 shadow-lg mb-6 border border-gray-700">
      <h2 class="text-lg font-bold text-yellow-300 mb-3">🔗 API STATUS</h2>
      <p id="apiStatus" class="text-green-400">กำลังตรวจสอบ...</p>
      <p id="apiVersion" class="text-gray-400 text-sm mt-1"></p>
    </div>

    <!-- ปุ่มคำสั่ง -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button onclick="checkHealth()" class="bg-green-600 hover:bg-green-700 p-3 rounded-lg font-semibold">ตรวจสอบสถานะระบบ</button>
      <button onclick="getBalance()" class="bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold">ดูยอดคงเหลือ (User#1)</button>
      <button onclick="deposit()" class="bg-yellow-600 hover:bg-yellow-700 p-3 rounded-lg font-semibold">ฝากเหรียญทดสอบ</button>
      <button onclick="refund()" class="bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-semibold">คืนเหรียญ (ยกเลิกคำสั่งซื้อ)</button>
    </div>

    <!-- Output -->
    <div class="bg-black text-green-400 rounded-lg p-4 overflow-auto text-sm shadow-inner" style="max-height: 280px;">
      <pre id="output">[ระบบพร้อมทำงาน]</pre>
    </div>

    <!-- Footer -->
    <footer class="mt-10 text-center text-gray-500 text-xs border-t border-gray-800 pt-4">
      © 2026 HENG HENG GLOBAL CO., LTD.<br>
      ระบบ HENG GLOBAL API v1.0.4 — Production Build<br>
      <span class="text-blue-400">https://api.hengheng88.app</span>
    </footer>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:5000";

    function logOutput(message, color = "text-green-400") {
      const out = document.getElementById("output");
      const timestamp = new Date().toLocaleTimeString();
      out.innerHTML += `\n[${timestamp}] ${message}`;
      out.scrollTop = out.scrollHeight;
    }

    async function checkHealth() {
      logOutput("🔍 ตรวจสอบสถานะระบบ...");
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        document.getElementById("apiStatus").textContent = "🟢 API ONLINE";
        document.getElementById("apiVersion").textContent = `อัปเดตเมื่อ: ${new Date(data.time).toLocaleString()}`;
        logOutput("✅ API ตอบสนองปกติ");
      } catch (err) {
        document.getElementById("apiStatus").textContent = "🔴 API OFFLINE";
        logOutput("❌ ไม่สามารถเชื่อมต่อ API ได้");
      }
    }

    async function getBalance() {
      logOutput("💰 กำลังตรวจสอบยอดคงเหลือ...");
      try {
        const res = await fetch(`${API_BASE}/api/wallet/balance/chanyanut`);
        const data = await res.json();
        logOutput(`ยอดคงเหลือปัจจุบัน: ${data.balance} HENG`);
      } catch {
        logOutput("❌ ดึงยอดไม่สำเร็จ");
      }
    }

    async function deposit() {
      logOutput("💎 ฝากเหรียญทดสอบ 100 HENG...");
      try {
        const res = await fetch(`${API_BASE}/api/wallet/transaction`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: "chanyanut",
            type: "deposit",
            amount: 100,
            meta: { source: "dashboard_manual_deposit" }
          }),
        });
        const data = await res.json();
        logOutput(`✅ ฝากสำเร็จ: TX#${data?.result?.tx_id || "?"}`);
      } catch {
        logOutput("❌ ฝากไม่สำเร็จ");
      }
    }

    async function refund() {
      logOutput("🔄 คืนเหรียญ (ตัวอย่าง)...");
      try {
        const res = await fetch(`${API_BASE}/api/orders/refund`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: 1,
            amount: 50,
            original_tx: 1
          }),
        });
        const data = await res.json();
        logOutput(`♻️ คืนเหรียญสำเร็จ: ยอดหลังคืน = ${data.balance_after_refund}`);
      } catch {
        logOutput("❌ คืนเหรียญไม่สำเร็จ");
      }
    }

    // โหลดครั้งแรก
    checkHealth();
  </script>
</body>
</html>
